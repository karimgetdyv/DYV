<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DYV - Coming Soon</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0a0f1d;
            --bg-card: #131b2e;
            --accent-navy: #002b66;
            --accent-teal: #00a88f;
            --accent-teal-glow: rgba(0, 168, 143, 0.3);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Ambient Glow Background Effects */
        .glow-bg {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 168, 143, 0.15) 0%, rgba(10, 15, 29, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        .glow-secondary {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(0, 43, 102, 0.4) 0%, rgba(10, 15, 29, 0) 70%);
            top: -100px;
            right: -100px;
            z-index: 0;
        }

        /* Main Container Card */
        .container {
            position: relative;
            z-index: 1;
            background: rgba(19, 27, 46, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 50px 40px;
            max-width: 550px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        /* Vector Logo Section (No subtitle/line) */
        .logo-container {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            font-weight: 800;
            letter-spacing: -2px;
            color: #0b3b75;
            margin-bottom: 25px;
            line-height: 1;
        }

        .logo-y {
            color: var(--accent-teal);
            position: relative;
            margin: 0 -2px;
            display: inline-block;
        }

        /* Decorative Leaf/Paper accent on 'Y' */
        .logo-y::after {
            content: '';
            position: absolute;
            top: 5px;
            right: -2px;
            width: 14px;
            height: 35px;
            border-right: 3px solid #34d399;
            border-radius: 0 20px 20px 0;
            opacity: 0.8;
        }

        /* Badge */
        .badge {
            display: inline-block;
            background: rgba(0, 168, 143, 0.1);
            border: 1px solid var(--accent-teal);
            color: var(--accent-teal);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        p.description {
            color: var(--text-secondary);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        /* Contact Box */
        .contact-box {
            background: rgba(10, 15, 29, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 16px 24px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: border-color 0.3s ease;
        }

        .contact-box:hover {
            border-color: var(--accent-teal);
        }

        .contact-icon {
            width: 20px;
            height: 20px;
            fill: var(--accent-teal);
        }

        .phone-link {
            color: var(--text-primary);
            font-weight: 600;
            font-size: 1.1rem;
            text-decoration: none;
            letter-spacing: 0.5px;
            transition: color 0.3s ease;
        }

        .phone-link:hover {
            color: var(--accent-teal);
        }

        /* Footer Copy */
        .footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: rgba(148, 163, 184, 0.5);
        }
    </style>
</head>
<body>

    <div class="glow-bg"></div>
    <div class="glow-secondary"></div>

    <div class="container">
        <!-- Logo (Clean DYV without the subtitle/line) -->
        <div class="logo-container">
            D<span class="logo-y">Y</span>V
        </div>

        <br>

        <!-- Status Tag -->
        <div class="badge">Coming Soon</div>

        <h1>We'll Be Online Shortly</h1>
        <p class="description">
            Our brand-new website is under construction. We are working hard to bring you a seamless online experience.
        </p>

        <!-- Contact / Mobile Section -->
        <div class="contact-box">
            <svg class="contact-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
            </svg>
            <!-- Replace +1234567890 with your actual mobile number below -->
            <a href="tel:+201037689999" class="phone-link">+201037689999</a>
        </div>

        <div class="footer">
            &copy; 2026 DYV. All rights reserved.
        </div>
    </div>

</body>
</html>
