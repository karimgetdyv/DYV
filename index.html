<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DYV — Community App</title>
<meta name="description" content="DYV is Egypt's premier community app for gated compounds. Coming soon.">
<meta property="og:title" content="DYV — Community App">
<meta property="og:description" content="The front door to every compound. Coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Barlow+Condensed:wght@300;400;700;900&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --navy:    #0C1426;
  --navy2:   #111E38;
  --navy3:   #162240;
  --bronze:  #A0784A;
  --bronzeL: #D4AD7A;
  --bronzeD: #5A3E22;
  --cream:   #F0EDE8;
  --muted:   #6A6660;
}

html, body {
  width: 100%; height: 100%;
  background: var(--navy);
  color: var(--cream);
  font-family: 'Cormorant Garamond', Georgia, serif;
  overflow-x: hidden;
}

/* ── PARTICLE CANVAS ── */
#canvas {
  position: fixed;
  inset: 0;
  width: 100%; height: 100%;
  z-index: 0;
  opacity: 0.35;
}

/* ── GRID OVERLAY ── */
.grid {
  position: fixed;
  inset: 0;
  z-index: 0;
  background-image:
    linear-gradient(rgba(160,120,74,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(160,120,74,0.04) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none;
}

/* ── MAIN ── */
main {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 24px;
  gap: 0;
}

/* ── LOGO MARK ── */
.logo-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 28px;
  animation: fadeUp 1.2s cubic-bezier(0.16,1,0.3,1) both;
}

.pyramids {
  width: 100px;
  height: auto;
  filter: drop-shadow(0 8px 32px rgba(160,120,74,0.4));
}

/* ── WORDMARK ── */
.wordmark {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  animation: fadeUp 1.2s 0.15s cubic-bezier(0.16,1,0.3,1) both;
}

.wordmark-dyv {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900;
  font-size: clamp(72px, 16vw, 120px);
  line-height: 0.9;
  letter-spacing: -2px;
  background: linear-gradient(135deg, #D4AD7A 0%, #A0784A 40%, #D4AD7A 70%, #A0784A 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.wordmark-sub {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 300;
  font-size: clamp(13px, 2.5vw, 17px);
  letter-spacing: 8px;
  text-transform: uppercase;
  color: var(--muted);
}

/* ── DIVIDER ── */
.divider {
  width: 1px;
  height: 60px;
  background: linear-gradient(to bottom, transparent, var(--bronzeD), transparent);
  margin: 40px 0;
  animation: fadeUp 1.2s 0.3s cubic-bezier(0.16,1,0.3,1) both;
}

/* ── HEADLINE ── */
.headline {
  text-align: center;
  animation: fadeUp 1.2s 0.4s cubic-bezier(0.16,1,0.3,1) both;
  max-width: 560px;
}

.headline h1 {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-size: clamp(26px, 5vw, 44px);
  line-height: 1.2;
  color: var(--cream);
  letter-spacing: 0.5px;
  margin-bottom: 16px;
}

.headline h1 em {
  font-style: italic;
  color: var(--bronzeL);
}

.headline p {
  font-family: 'DM Mono', monospace;
  font-size: clamp(11px, 1.8vw, 13px);
  color: var(--muted);
  letter-spacing: 2px;
  text-transform: uppercase;
  line-height: 1.8;
}

/* ── BADGE ── */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 32px;
  padding: 10px 22px;
  border: 1px solid var(--bronzeD);
  border-radius: 2px;
  animation: fadeUp 1.2s 0.55s cubic-bezier(0.16,1,0.3,1) both;
}

.badge-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--bronze);
  animation: pulse 2s infinite;
}

.badge-text {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--bronze);
}

/* ── EMAIL ── */
.contact {
  margin-top: 48px;
  text-align: center;
  animation: fadeUp 1.2s 0.7s cubic-bezier(0.16,1,0.3,1) both;
}

.contact-label {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 10px;
}

.contact-email {
  display: inline-block;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 400;
  font-size: clamp(16px, 3vw, 22px);
  letter-spacing: 2px;
  color: var(--bronzeL);
  text-decoration: none;
  border-bottom: 1px solid var(--bronzeD);
  padding-bottom: 2px;
  transition: color 0.2s, border-color 0.2s;
}

.contact-email:hover {
  color: var(--cream);
  border-color: var(--bronze);
}

/* ── BOTTOM BAR ── */
.bottom {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 2;
  padding: 16px 32px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-top: 1px solid rgba(160,120,74,0.1);
  animation: fadeUp 1.2s 0.9s cubic-bezier(0.16,1,0.3,1) both;
}

.bottom-copy {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 2px;
  color: rgba(106,102,96,0.5);
}

.bottom-location {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 2px;
  color: rgba(106,102,96,0.5);
  display: flex;
  align-items: center;
  gap: 6px;
}

.bottom-location::before {
  content: '';
  display: block;
  width: 4px; height: 4px;
  border-radius: 50%;
  background: var(--bronzeD);
}

/* ── CORNER DECORATION ── */
.corner {
  position: fixed;
  width: 40px; height: 40px;
  opacity: 0.3;
}
.corner-tl { top: 20px; left: 20px; border-top: 1px solid var(--bronze); border-left: 1px solid var(--bronze); }
.corner-tr { top: 20px; right: 20px; border-top: 1px solid var(--bronze); border-right: 1px solid var(--bronze); }
.corner-bl { bottom: 52px; left: 20px; border-bottom: 1px solid var(--bronze); border-left: 1px solid var(--bronze); }
.corner-br { bottom: 52px; right: 20px; border-bottom: 1px solid var(--bronze); border-right: 1px solid var(--bronze); }

/* ── ANIMATIONS ── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%       { opacity: 0.4; transform: scale(0.8); }
}

/* ── RESPONSIVE ── */
@media (max-width: 480px) {
  .bottom { padding: 12px 16px; }
  .corner { display: none; }
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>
<div class="grid"></div>

<div class="corner corner-tl"></div>
<div class="corner corner-tr"></div>
<div class="corner corner-bl"></div>
<div class="corner corner-br"></div>

<main>

  <div class="logo-wrap">
    <!-- Inline SVG pyramid mark matching the uploaded logo style -->
    <svg class="pyramids" viewBox="0 0 100 120" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#D4AD7A"/>
          <stop offset="50%" stop-color="#A0784A"/>
          <stop offset="100%" stop-color="#D4AD7A"/>
        </linearGradient>
        <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#BF9460"/>
          <stop offset="50%" stop-color="#8A6438"/>
          <stop offset="100%" stop-color="#BF9460"/>
        </linearGradient>
        <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#A0784A"/>
          <stop offset="50%" stop-color="#704E28"/>
          <stop offset="100%" stop-color="#A0784A"/>
        </linearGradient>
      </defs>
      <!-- Large base pyramid -->
      <polygon points="50,60 12,108 88,108" fill="url(#g3)"/>
      <polygon points="50,60 12,108 50,108" fill="rgba(0,0,0,0.18)"/>
      <!-- Brick lines large -->
      <line x1="31" y1="84" x2="69" y2="84" stroke="rgba(0,0,0,0.15)" stroke-width="0.8"/>
      <line x1="24" y1="96" x2="76" y2="96" stroke="rgba(0,0,0,0.15)" stroke-width="0.8"/>
      <line x1="50" y1="60" x2="50" y2="108" stroke="rgba(255,255,255,0.08)" stroke-width="0.6"/>
      <line x1="38" y1="72" x2="62" y2="72" stroke="rgba(0,0,0,0.12)" stroke-width="0.8"/>
      <!-- Mid pyramid -->
      <polygon points="50,32 20,68 80,68" fill="url(#g2)"/>
      <polygon points="50,32 20,68 50,68" fill="rgba(0,0,0,0.15)"/>
      <line x1="35" y1="50" x2="65" y2="50" stroke="rgba(0,0,0,0.15)" stroke-width="0.8"/>
      <line x1="27" y1="60" x2="73" y2="60" stroke="rgba(0,0,0,0.12)" stroke-width="0.8"/>
      <line x1="50" y1="32" x2="50" y2="68" stroke="rgba(255,255,255,0.07)" stroke-width="0.5"/>
      <!-- Small top pyramid -->
      <polygon points="50,8 28,32 72,32" fill="url(#g1)"/>
      <polygon points="50,8 28,32 50,32" fill="rgba(0,0,0,0.12)"/>
      <line x1="39" y1="20" x2="61" y2="20" stroke="rgba(0,0,0,0.12)" stroke-width="0.8"/>
      <line x1="50" y1="8" x2="50" y2="32" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
      <!-- Top apex gleam -->
      <circle cx="50" cy="8" r="1.5" fill="rgba(212,173,122,0.8)"/>
    </svg>
  </div>

  <div class="wordmark">
    <div class="wordmark-dyv">DYV</div>
    <div class="wordmark-sub">Community App</div>
  </div>

  <div class="divider"></div>

  <div class="headline">
    <h1>The <em>front door</em><br>to every compound.</h1>
    <p>Egypt's community platform<br>for gated residential developments</p>
  </div>

  <div class="badge">
    <div class="badge-dot"></div>
    <div class="badge-text">Launching soon</div>
  </div>

  <div class="contact">
    <div class="contact-label">Get in touch</div>
    <a href="mailto:karim@getdyv.com" class="contact-email">karim@getdyv.com</a>
  </div>

</main>

<div class="bottom">
  <div class="bottom-copy">© 2026 DYV</div>
  <div class="bottom-location">Cairo, Egypt</div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H, particles = [];

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}

function Particle() {
  this.x = Math.random() * W;
  this.y = Math.random() * H;
  this.vx = (Math.random() - 0.5) * 0.3;
  this.vy = (Math.random() - 0.5) * 0.3;
  this.r  = Math.random() * 1.5 + 0.3;
  this.a  = Math.random() * 0.5 + 0.1;
}

Particle.prototype.update = function() {
  this.x += this.vx;
  this.y += this.vy;
  if (this.x < 0) this.x = W;
  if (this.x > W) this.x = 0;
  if (this.y < 0) this.y = H;
  if (this.y > H) this.y = 0;
};

Particle.prototype.draw = function() {
  ctx.beginPath();
  ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
  ctx.fillStyle = `rgba(160,120,74,${this.a})`;
  ctx.fill();
};

function init() {
  resize();
  particles = Array.from({length: 80}, () => new Particle());
}

function connect() {
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      const d  = Math.sqrt(dx*dx + dy*dy);
      if (d < 120) {
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.strokeStyle = `rgba(160,120,74,${0.12 * (1 - d/120)})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    }
  }
}

function loop() {
  ctx.clearRect(0, 0, W, H);
  particles.forEach(p => { p.update(); p.draw(); });
  connect();
  requestAnimationFrame(loop);
}

init();
loop();
window.addEventListener('resize', () => { resize(); });
</script>
</body>
</html>
